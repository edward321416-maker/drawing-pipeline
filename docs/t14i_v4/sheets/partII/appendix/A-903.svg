<text x="20.000" y="237.000" font-family="Malgun Gothic, Arial, sans-serif" font-size="2.470" font-weight="normal" fill="#333" text-anchor="start">· 8F 2,526.0㎡는 프로그램 볼륨 투영 단순합이며 층판 순면적 2,339.3㎡와 다른 정의다.</text>
<text x="20.000" y="244.000" font-family="Malgun Gothic, Arial, sans-serif" font-size="2.470" font-weight="normal" fill="#333" text-anchor="start">· 12F 2,489.1㎡에는 타층 볼륨 투영 323.7㎡가 포함되고, 프로그램 588.7㎡가 층판 개구 위에 걸친다.</text>
<text x="20.000" y="251.000" font-family="Malgun Gothic, Arial, sans-serif" font-size="2.470" font-weight="normal" fill="#333" text-anchor="start">· 전용/공용 벽 경계가 모델에 없어 순사용면적은 UNRESOLVED. 프로그램 값을 사용면적으로 바꾸지 않았다.</text>
