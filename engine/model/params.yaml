# FILE: model/params.yaml
# 엔진의 유일한 수치 출처. 코드에 같은 숫자를 다시 쓰지 않는다.
slice:
  plan_cut_height_m: 1.5            # 평면 절단 높이 (바닥 위)
  check_heights_m: [0.3, 1.5, 3.0, 5.7]  # 3D 간섭 검사 높이. 5.7 = 1층 층고 6.0 m(중간발표 ZF: 1F 0.0, 2F 6.0)의 천장 아래 0.3 m
grid:
  spacing_m: 9.0
  tolerance_m: 0.01
clearance:
  furniture_to_column_m: 1.2        # 기물-기둥 최소 이격 (통로 최소폭 1,200 mm와 같은 값)
zones:
  overlap_tolerance_m2: 0.01
  coverage_tolerance_ratio: 0.005   # 바닥 슬래브 중 구획존이 덮지 못해도 되는 비율
render:
  scale_denominator: 200            # 나머지 도면 1:200 (사용자 지시 2026-11-01)
  site_scale_denominator: 400       # 전체 1층 도면(대지 포함) 1:400 (사용자 지시 2026-11-01)
  site_context_margin_m: [14.0, 36.0, 14.0, 14.0]   # 대지 도면: 대지 외곽에서 바깥으로 보이는 폭(좌, 하, 우, 상). 남쪽은 장충단로(8차로)까지 보이도록 넓다
  margin_m: 4.0
  dpi: 300
  label_gap_m: 0.3
  label_pad_m: 0.25
text:
  collision_tolerance_m2: 1.0e-6
annotation:                          # 단선 평면의 표기 계층 (건물 외곽에서 바깥쪽으로 잰 거리, m)
  base_scale_denominator: 300        # 아래 m 값들이 종이 위 크기에 맞게 정해진 축척. 다른 축척에서는 비례해 늘리고 줄인다(종이 위 크기 유지)
  dim_tier1_m: 3.0                   # 칸별 치수선
  dim_tier2_m: 5.5                   # 전체 치수선
  bubble_offset_m: 9.0               # 격자 기호 중심
  bubble_radius_m: 1.5               # 약 Ø9 mm @ 1:300
  margins_m: [12.0, 9.0, 8.0, 19.0]  # 좌, 하, 우, 상
  scale_bar_m: 20.0
stair_core:                          # 특별피난계단 코어 심볼 (4갈래 ㅁ자). 출처: 중간발표 s7.py·law_s7.py, 편의법 시행규칙 별표 1 제8호
  wall_t_m: 0.25                     # 코어 벽 두께
  vestibule_depth_m: 1.6             # 부속실 깊이 (s7.py: 계단실 안쪽 1.6 m)
  partition_t_m: 0.15                # 부속실-계단실 칸막이
  flight_w_m: 1.2                    # 계단·계단참 유효너비
  tread_m: 0.28                      # 디딤판
  riser_m: 0.18                      # 챌면
  floor_height_m: 6.0                # 층고 (중간발표 ZF: 1F 0.0, 2F 6.0)
  door_w_m: 1.2                      # 방화문 폭
  cut_height_m: 1.5                  # 평면 절단 높이 (절단선 위치 계산용)
  min_flight_w_m: 1.2                # 법규 하한
  min_tread_m: 0.28
  max_riser_m: 0.18
  min_vestibule_area_m2: 3.0         # 특별피난계단 부속실 3㎡ 이상 (건축법 시행령 제35조)
  min_door_w_m: 1.2
  sheet_scale_denominator: 50        # 심볼 시트 축척 1:50
  sheet_dpi: 200
restroom:                            # 화장실 심볼. 출처: AGENTS.md §3.2, 장애인 편의시설 기준
  wall_t_m: 0.15                     # 방 둘레·방 사이 벽
  thin_t_m: 0.04                     # 큐비클 칸막이·스크린
  door_w_m: 1.2                      # 여닫이 출입문 폭
  sliding_door_w_m: 1.0              # 장애인 슬라이딩 문 폭
  min_door_w_m: 0.9
  cubicle_general_m: [0.9, 1.2]      # 일반 큐비클 이상 (폭 x 깊이)
  cubicle_accessible_m: [1.6, 2.0]   # 장애인 큐비클 이상
  stall_depth_m: 1.3                 # 일반 큐비클 깊이(설계값)
  accessible_depth_m: 2.2            # 장애인 큐비클 깊이(설계값): 회전 원 + 양변기
  turning_circle_d_m: 1.5            # 휠체어 회전 원
  entry_clear_m: 1.2                 # 출입문 앞 유효 통로
  corridor_min_w_m: 1.2
  basin_w_m: 0.6                     # 세면대 카운터 폭
  basin_d_m: 0.5
  urinal_w_m: 0.4
  urinal_d_m: 0.35
  urinal_pitch_m: 0.7
  bowl_w_m: 0.4                      # 양변기
  bowl_d_m: 0.65
  sheet_scale_denominator: 50
  sheet_dpi: 200
tube:                                # 튜브 심볼 (T1 나선 램프, T2 빛 튜브, T3·T4 전망 승강기, 서측 캡슐). 출처: AGENTS.md §3, 중간발표 m_1f_source.json, build_master.py
  glass_t_m: 0.15                    # 유리 튜브 벽 두께 (build_master.py GLASS_T)
  ramp_w_m: 2.4                      # T1 램프 통로 폭 (설계값, 사용자 검토 대상)
  min_ramp_w_m: 1.2                  # 통로 최소폭 (clearance.furniture_to_column_m과 같은 1,200 mm)
  spiral_turn_deg: 300               # 나선 회전 화살표가 도는 각도
  spiral_start_deg: -120             # 나선 시작 각도 (+x가 0°, 반시계가 +)
  spiral_margin_m: 0.35              # 나선과 림 사이 최소 이격
  shaft_outer_m: 2.6                 # 승강로 외곽 정사각형 한 변 (24인승 전망 승강기, 설계값)
  shaft_wall_t_m: 0.15               # 승강로 벽 두께
  shaft_gap_m: 0.3                   # 두 승강로 사이 간격
  shaft_to_glass_m: 0.3              # 승강로와 유리 벽 안쪽 사이 최소 이격
  car_door_w_m: 1.2                  # 승강기 문 폭
  entry_w_m: 2.4                     # 유리 원통 출입구(슬라이딩) 폭
  min_door_w_m: 1.2
  lobby_min_depth_m: 1.5             # 승강로 문 앞 유효 깊이 (휠체어 회전 1.5 m)
  entry_clear_m: 1.2                 # 출입구 바깥 유효 통로 깊이
  context_column_m: 3.0              # 시트에 함께 보이는 주변 기둥의 범위 (튜브 바깥에서 잰 거리)
  sheet_scale_denominator: 50
  sheet_dpi: 200
